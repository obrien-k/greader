steps:
  # 1. Build and push server container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/greader-server:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/greader-server:latest'
      - './server'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/greader-server:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/greader-server:latest']

  # 2. Deploy server to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'greader-server'
      - '--image'
      - 'gcr.io/$PROJECT_ID/greader-server:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'

  # 3. Build and push web frontend container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/greader-web:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/greader-web:latest'
      - './web'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/greader-web:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/greader-web:latest']

  # 4. Deploy web frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'greader-web'
      - '--image'
      - 'gcr.io/$PROJECT_ID/greader-web:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'

images:
  - 'gcr.io/$PROJECT_ID/greader-server:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/greader-server:latest'
  - 'gcr.io/$PROJECT_ID/greader-web:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/greader-web:latest'

timeout: 1200s
options:
  machineType: 'E2_HIGHCPU_8'
